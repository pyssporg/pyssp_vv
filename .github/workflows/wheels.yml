name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        # The version guard reads the static [project].version from
        # pyproject.toml, so no editable install is required.
        run: |
          python -m pip install --upgrade pip build

      - name: Build wheel and sdist
        run: python -m build --wheel --sdist

      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}." >&2
            exit 1
          fi

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import pyssp_vv.judge, pyssp_vv.policy, pyssp_vv.evidence, pyssp_vv.measure"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
