# Build the wheel on every push to main and on a version tag (vX.Y.Z).
# The wheel is kept as a workflow artifact, and on a tag it is attached to
# the GitHub release so users can install a pinned release without cloning
# the repository. The tag must match the version in pyproject.toml.

name: wheels

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write # required to create or update the release

jobs:
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Check the version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}." >&2
            exit 1
          fi

      - name: Smoke test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/python -c "import pyssp_vv.judge, pyssp_vv.policy, pyssp_vv.evidence, pyssp_vv.measure"

      - uses: actions/upload-artifact@v4
        with:
          name: pyssp_vv-wheel
          path: dist/*.whl

      - name: Attach the wheel to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl --title "$GITHUB_REF_NAME" --generate-notes
          fi
