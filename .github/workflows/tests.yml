name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Tests
        run: python -m pytest -m "not slow"

      - name: Contracts import nothing third-party
        run: |
          python - <<'PY'
          import sys
          import pyssp_vv.judge
          import pyssp_vv.policy
          import pyssp_vv.evidence
          heavy = {"numpy", "matplotlib", "pint"} & set(sys.modules)
          assert not heavy, f"contracts imported {sorted(heavy)}"
          PY

      - name: Tests leave the checkout clean
        run: git diff --exit-code && test -z "$(git status --porcelain)"
