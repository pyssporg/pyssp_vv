[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "pyssp-vv"
version = "0.1.0"
description = "Verification and validation of simulation models: measurement policies, criteria, and judgment."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pyssporg contributors" }]
keywords = ["ssp", "fmi", "simulation", "verification", "validation", "tolerance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
# The contracts (policy, judge, evidence) are standard-library only.
dependencies = []

[project.optional-dependencies]
measure = ["numpy"]
figures = ["matplotlib"]
units = ["pint"]
all = ["numpy", "matplotlib", "pint"]
dev = ["pytest>=8", "numpy", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyssp_vv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true
addopts = "-q"
markers = [
  "level_static: import-graph and configuration rules",
  "level_unit: one module's logic with fabricated inputs",
  "level_component: a module's own artifacts, files, and round-trips",
  "level_contract: the seam between produced and consumed types",
  "level_integration: two or more modules composed",
  "level_system: an end-to-end run through the public entry points",
  "level_acceptance: a requirement stated in the intent or breakdown",
  "slow: too slow for the default suite",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
